<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>גלגל ההרפתקאות | בוץ הרפתקאות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E4;
    --ink:#2B2620;
    --ink-soft:#5A5348;
    --line:#D9D0BC;
    --winter:#5F93B0; --winter-soft:#DCEAEF;
    --spring:#7CA45E; --spring-soft:#E3EBD8;
    --summer:#E0A33E; --summer-soft:#F5E6CD;
    --autumn:#C17049; --autumn-soft:#F2DED4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Heebo',sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}

  header{padding:64px 0 8px;text-align:center;}
  .eyebrow{font-size:15px;color:var(--ink-soft);margin:0 0 14px;}
  h1{
    font-family:'Frank Ruhl Libre',serif;
    font-weight:700;
    font-size:clamp(34px,6vw,54px);
    margin:0 0 18px;
  }
  .greeting{max-width:560px;margin:0 auto 8px;font-size:17px;color:var(--ink-soft);}

  .season-key{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px;
    padding:8px 0 32px;font-size:13px;color:var(--ink-soft);
  }
  .season-key span{display:inline-flex;align-items:center;gap:8px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .dot.w{background:var(--winter);} .dot.sp{background:var(--spring);}
  .dot.su{background:var(--summer);} .dot.a{background:var(--autumn);}

  .layout{
    display:grid;
    grid-template-columns:0.9fr 1.1fr;
    gap:40px;
    align-items:start;
  }
  .wheel-col{
    position:sticky;
    top:32px;
    display:flex;
    justify-content:center;
  }
  #wheel{display:block;}

  .story-col{padding-bottom:20vh;}
  .stop{
    position:relative;
    min-height:50vh;
    margin-bottom:28px;
    border-radius:16px;
    overflow:hidden;
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:flex-end;
    opacity:0.25;
    transform:translateY(16px);
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  .stop::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(20,16,10,0) 30%, rgba(20,16,10,0.82) 100%);
  }
  .stop.in-view{opacity:1;transform:translateY(0);}
  .stop .content{
    position:relative;
    z-index:1;
    padding:32px;
    display:block;
    text-decoration:none;
    color:inherit;
  }
  .stop .content:hover h2{text-decoration:underline;}
  .stop .season-tag{
    display:inline-block;
    align-self:flex-start;
    font-size:12px;
    color:#fff;
    padding:3px 10px;
    border-radius:2px;
    margin-bottom:14px;
  }
  .stop.winter .season-tag{background:var(--winter);}
  .stop.spring .season-tag{background:var(--spring);}
  .stop.summer .season-tag{background:var(--summer);}
  .stop.autumn .season-tag{background:var(--autumn);}
  .stop h2{
    font-family:'Frank Ruhl Libre',serif;
    font-weight:400;
    font-size:30px;
    color:#fff;
    margin:0 0 12px;
  }
  .stop h2 .dest{font-weight:700;}
  .stop p{font-size:16px;color:rgba(255,255,255,0.88);max-width:460px;margin:0;}

  footer{
    text-align:center;
    padding:56px 0 64px;
    border-top:1px solid var(--line);
  }
  footer p{font-size:14px;color:var(--ink-soft);margin:0 0 18px;}
  .cta{
    display:inline-block;
    font-weight:500;
    font-size:15px;
    color:var(--paper);
    background:var(--ink);
    padding:12px 30px;
    border-radius:2px;
    text-decoration:none;
  }
  .cta:hover{opacity:0.85;}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    .wheel-col{
      position:sticky;
      top:0;
      padding:8px 0;
      background:linear-gradient(var(--paper) 80%, transparent);
      z-index:2;
    }
    .stop{min-height:46vh;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">שנה טובה מבוץ הרפתקאות</p>
    <h1>גלגל ההרפתקאות</h1>
    <p class="greeting">לקראת השנה החדשה, ריכזנו עבורכם מתי הזמן הכי טוב לצאת לכל אחד מהיעדים שלנו. גללו למטה — הגלגל יקטין ויתלווה אליכם לאורך הדרך.</p>
    <div class="season-key">
      <span><i class="dot w"></i>חורף</span>
      <span><i class="dot sp"></i>אביב</span>
